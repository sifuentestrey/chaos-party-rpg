<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#16131e">
  <meta name="description" content="A room full of friends. One very bad idea. A phone-controlled pixel tavern adventure.">
  <title>Chaos Party — The Tipsy Wyvern</title>
  <link rel="icon" type="image/svg+xml" href="assets/dice.svg">
  <link rel="stylesheet" href="style.css">
  <script src="runtime.js"></script>
  <script src="vendor/qrcode.js" defer></script>
  <script type="module" src="app.js"></script>
</head>
<body>
  <div id="app"><div class="loading"><span class="loading-die">✦</span>Opening the tavern…</div></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <div id="announcer" class="sr-only" aria-live="polite"></div>
  <script>
    (() => {
      const app = document.getElementById('app');
      const showBootError = (reason) => {
        if (!app || app.dataset.bootError) return;
        app.dataset.bootError = '1';
        const detail = String(reason?.message || reason || 'The game script did not finish loading.');
        app.innerHTML = `<main style="max-width:560px;margin:15vh auto;padding:28px 22px;color:#f3eadb;font:16px/1.6 -apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;background:#201b2b;border:1px solid #594667;border-radius:14px"><h1 style="margin:0 0 10px;font:500 30px Georgia,serif">The tavern did not open</h1><p style="margin:0 0 16px;color:#b0a5b9">The Codespaces server answered, but the phone could not start the game screen.</p><p style="margin:0 0 18px;font-size:12px;color:#e49a9f;overflow-wrap:anywhere">${detail.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}</p><a href="/health" style="color:#e5bd79">Check the game server</a><span style="color:#b0a5b9"> · </span><a href="/host" style="color:#e5bd79">Try the host screen again</a></main>`;
      };
      window.addEventListener('error', event => showBootError(event.error || event.message));
      window.addEventListener('unhandledrejection', event => showBootError(event.reason));
      window.setTimeout(() => {
        if (app?.querySelector('.loading')) showBootError('The game script is still loading.');
      }, 15000);
    })();
  </script>
</body>
</html>
